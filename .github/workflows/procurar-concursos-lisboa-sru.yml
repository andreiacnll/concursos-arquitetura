name: Procurar concursos Lisboa SRU

on:
  workflow_dispatch:

  schedule:
    # Diariamente às 10:17 UTC. A página é pequena e pública.
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: procurar-concursos-lisboa-sru
  cancel-in-progress: false

jobs:
  procurar-concursos-lisboa-sru:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LISBOA_SRU_DIAS_PESQUISA: "7"
      LISBOA_SRU_INTERVALO_PEDIDOS: "2"
      LISBOA_SRU_MAX_TENTATIVAS: "3"
      LISBOA_SRU_OLLAMA_AMBIGUOS: "0"

    steps:
      - name: Obter o código
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar adaptador
        run: |
          python -m compileall -q app
          python -m unittest \
            testes_ai.test_coletor_lisboa_sru \
            testes_ai.test_intervention_program

      - name: Recolher concursos relevantes
        run: python -m app.coletor_lisboa_sru

      - name: Guardar atualização dos dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add concursos.db lisboa_sru_checkpoint.json

          if git diff --cached --quiet; then
            echo "Não existem alterações nos dados da Lisboa SRU."
            exit 0
          fi

          git commit -m "Atualizar concursos Lisboa SRU"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
