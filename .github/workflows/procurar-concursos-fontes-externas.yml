name: Procurar concursos em fontes externas

on:
  workflow_dispatch:

  schedule:
    # Semanalmente ao sábado às 10:47 UTC.
    # A BASE.gov corre primeiro às 08:17 UTC e mantém prioridade.
    - cron: "47 10 * * 6"

permissions:
  contents: write

concurrency:
  group: procurar-concursos-fontes-externas
  cancel-in-progress: false

jobs:
  procurar-fontes-externas:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      FONTES_EXTERNAS_DIAS_PESQUISA: "7"
      FONTES_EXTERNAS_MAX_TENTATIVAS: "3"
      FONTES_EXTERNAS_TIMEOUT_SEGUNDOS: "35"
      FONTES_EXTERNAS_INTERVALO_LISTAGEM: "5"
      FONTES_EXTERNAS_INTERVALO_DETALHES: "8"
      FONTES_EXTERNAS_JITTER_MAXIMO: "4"
      FONTES_EXTERNAS_BACKOFF_BASE: "15"
      FONTES_EXTERNAS_BACKOFF_MAX: "120"
      FONTES_EXTERNAS_MAX_DETALHES: "25"
      FONTES_EXTERNAS_FALHAS_CIRCUITO: "3"
      FONTES_EXTERNAS_SUSPENSAO_HORAS: "12"

    steps:
      - name: Obter o código
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar adaptadores
        run: |
          python -m compileall -q app
          python -m unittest testes_ai.test_fontes_externas testes_ai.test_fontes_externas_transport testes_ai.test_oasrs_active_listing testes_ai.test_fontes_externas_throttle

      - name: Recolher fontes externas
        run: python -m app.coletor_fontes_externas

      - name: Guardar atualização dos dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add concursos.db fontes_externas_checkpoint.json

          if [ -f fontes_externas_transport_state.json ]; then
            git add fontes_externas_transport_state.json
          fi

          if git diff --cached --quiet; then
            echo "Não existem alterações nas fontes externas."
            exit 0
          fi

          git commit -m "Atualizar concursos de fontes externas"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
